[build-system]
requires = ["setuptools==68.2.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "griffin"
version = "0.1.0"
description = "CLI-first research pipeline for neoantigen candidate discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Griffin Contributors" }]
dependencies = [
  "typer>=0.12",
  "pydantic>=1.10",
  "PyYAML>=6.0",
  "requests>=2.31",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests>=2.31",
]
pdf = ["reportlab>=4.0"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests>=2.31",
]

[project.scripts]
griffin = "griffin.cli:app"

[tool.setuptools.packages.find]
include = ["griffin*"]

[tool.setuptools.package-data]
griffin = ["config/defaults.yaml", "reports/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

